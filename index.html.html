  --b-blue:#005C8F;      --b-blue-d:#00456C;   --b-blue-l:#1B7FB8;
  --b-magenta:#D31D52;   --b-magenta-d:#AE275C;
  --b-purple:#5E4073;    --b-navy:#0F0F49;
  --b-grad:linear-gradient(104deg,#035C8E 0%,#5E4073 53%,#AE275C 100%);
  --ink:#13203A; --ink-2:#44566F; --ink-3:#7C8DA6; --ink-4:#A4B2C4;
  --bg:#F5F8FB; --sf:#fff; --sf-2:#F7FAFD;
  --line:#E3EAF2; --line-2:#EFF3F8;
  --ok:#1C7A47;   --ok-bg:#E8F6EE;
  --bad:#B3261E;  --bad-bg:#FDECEC;
  --warn:#B07D13; --warn-bg:#FFF8E6;
  --c1:#0E6FA6; --c2:#D31D52; --c3:#0F9E8C; --c4:#B5701A; --c5:#6E5AA8; --c6:#4E8C22; --c7:#3A4E9E; --c8:#1E9BBF;
  --r:8px;
  --f-title:"SVN-Gilroy","Poppins","Segoe UI",system-ui,Arial,sans-serif;
  --f-body:"Open Sans","Segoe UI",system-ui,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:13px/1.45 var(--f-body);background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:var(--b-blue)}
h1,h2,h3,.o .v{font-family:var(--f-title)}

/* ---------- 1. THANH THƯƠNG HIỆU ---------- */
#cnbar{position:sticky;top:0;z-index:40;display:flex;align-items:stretch;min-height:52px;
  background:var(--b-grad);color:#fff;box-shadow:0 1px 0 rgba(15,32,58,.08)}
#cnbar::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:var(--wave) no-repeat center bottom/cover}
#cnbar>*{position:relative;z-index:1}
#cnbar .logo{display:flex;align-items:center;gap:10px;padding:0 16px;
  border-right:1px solid rgba(255,255,255,.22);flex:0 0 auto}
#cnbar .logo img{height:24px;width:auto;display:block}
#cnbar .logo .lc{display:none;width:74px;height:26px;background:var(--logo-color) no-repeat left center/contain}
/* min-width:0 bắt buộc — không có nó, dải nút chi nhánh không co được và kéo
   chiều ngang của cả trang vượt quá bề ngang điện thoại */
#cnbar .ct{display:flex;overflow-x:auto;scrollbar-width:none;min-width:0}
#cnbar .ct::-webkit-scrollbar{display:none}
#cnbar button{background:none;border:0;border-bottom:3px solid transparent;padding:6px 16px;
  font:inherit;font-weight:600;color:rgba(255,255,255,.78);cursor:pointer;letter-spacing:.2px;
  white-space:nowrap}
#cnbar button:hover{color:#fff;background:rgba(255,255,255,.1)}
#cnbar button.on{color:#fff;border-bottom-color:#fff;background:rgba(255,255,255,.14)}
#cnbar button .n{display:block;font-weight:400;font-size:11.5px;color:rgba(255,255,255,.6)}
#cnbar .pbn{margin-left:auto;display:flex;align-items:center;gap:10px;padding:0 16px;
  font-size:12.5px;color:rgba(255,255,255,.85);white-space:nowrap}
#cnbar .pbn b{font-weight:600;color:#fff}

/* ---------- 2. KHUNG TRANG ---------- */
#wrap{display:flex;min-height:calc(100vh - 52px)}
#sb{width:208px;flex:0 0 208px;background:var(--sf);border-right:1px solid var(--line);padding:8px 0}
#sb .nh{padding:14px 16px 5px;font-size:11px;letter-spacing:.9px;color:var(--ink-4);
  text-transform:uppercase;font-weight:700}
#sb .m{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;
  padding:9px 16px;font:inherit;color:var(--ink-2);cursor:pointer}
#sb .m:hover{background:#F2F7FC;color:var(--ink)}
#sb .m.on{border-left-color:var(--b-blue);color:var(--b-blue);font-weight:600;background:#EFF6FC}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#hd{background:var(--sf);border-bottom:1px solid var(--line);padding:13px 20px;
  display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
#hd h1{margin:0;font-size:17.5px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
#hd .sub{color:var(--ink-3);font-size:12.5px;margin-top:4px}
#hd .nut{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#kq{padding:16px 20px 44px;flex:1;min-width:0;max-width:100%;overflow-x:clip}

/* ---------- 3. NÚT ---------- */
button.b{background:var(--b-blue);color:#fff;border:0;border-radius:6px;padding:8px 14px;
  font:inherit;font-weight:600;cursor:pointer}
button.b:hover{background:var(--b-blue-d)}
button.b.p{background:var(--sf);color:var(--b-blue);border:1px solid #C3D6E6}
button.b.p:hover{background:#EFF6FC}
button.b:disabled{background:var(--line-2);color:var(--ink-4);cursor:default}

/* ---------- 4. KHỐI ---------- */
.kh{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);margin:0 0 14px;min-width:0}
/* tiêu đề khối: KHÔNG dùng flex — chữ dài phải tự xuống dòng trên màn hình hẹp,
   cụm nút xem thả về bên phải bằng float */
.kh>h2{position:relative;margin:0;font-size:13.5px;font-weight:700;color:var(--ink);
  padding:12px 14px 12px 20px;border-bottom:1px solid var(--line-2);
  overflow-wrap:anywhere;line-height:1.5}
.kh>h2::after{content:"";display:block;clear:both}
.kh>h2::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;
  border-radius:0 2px 2px 0;background:var(--b-magenta)}
.kh>h2 .dv{font-weight:400;color:var(--ink-2)}
.kh>h2 .pm{float:right;display:flex;gap:6px;margin:-2px 0 4px 10px}
.kh>h2 .pm button{background:none;border:1px solid var(--line);border-radius:5px;color:var(--ink-2);
  font:inherit;font-size:12px;padding:3px 9px;cursor:pointer}
.kh>h2 .pm button:hover{background:#EFF6FC;color:var(--b-blue)}
.kh>h2 .pm button.on{background:#EFF6FC;border-color:#C3D6E6;color:var(--b-blue);font-weight:600}
.kh .nd{padding:13px 14px}
.kh .nd.k0{padding:0}
.hai{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.haiV{display:grid;grid-template-columns:296px minmax(0,1fr);gap:14px;align-items:start}
.haiV.phai{grid-template-columns:minmax(0,1fr) 296px}

/* ---------- 5. Ô CHỈ SỐ ---------- */
.oct{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.oct.s6{grid-template-columns:repeat(6,minmax(0,1fr))}
.oct.s5{grid-template-columns:repeat(5,minmax(0,1fr))}
.oct.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.o{position:relative;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 13px;overflow:hidden;min-width:0}
.o::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c1)}
.o:nth-child(2)::before{background:var(--c2)} .o:nth-child(3)::before{background:var(--c3)}
.o:nth-child(4)::before{background:var(--c4)} .o:nth-child(5)::before{background:var(--c5)}
.o:nth-child(6)::before{background:var(--c6)}
.o .nh{font-size:12.5px;color:var(--ink-2)}
.o .v{font-size:22px;font-weight:700;margin:7px 0 2px;letter-spacing:-.4px}
.o .u{font-size:12.5px;color:var(--ink-3);font-weight:400;margin-left:3px;font-family:var(--f-body)}
.o .tt{height:3px;background:var(--line-2);border-radius:2px;margin-top:10px;overflow:hidden}
.o .tt i{display:block;height:3px;background:var(--b-blue);border-radius:2px}
.o .gc{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.o .bd{position:absolute;top:10px;right:11px;font-size:11.5px;font-weight:700;padding:1px 7px;
  border-radius:9px;background:var(--line-2);color:var(--ink-2)}
.o .bd.x{background:var(--ok-bg);color:var(--ok)}
.o .bd.d{background:var(--bad-bg);color:var(--bad)}
.o.hl{background:var(--b-grad);border-color:transparent;color:#fff}
.o.hl::before{display:none}
.o.hl .nh,.o.hl .u,.o.hl .gc{color:rgba(255,255,255,.82)}
.o.hl .tt{background:rgba(255,255,255,.25)} .o.hl .tt i{background:#fff}
.o.hl .bd{background:rgba(255,255,255,.22);color:#fff}

/* ---------- 6. BẢNG ---------- */
.bgw{overflow:auto;max-height:76vh;border-radius:0 0 var(--r) var(--r);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line-2);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--sf-2);color:var(--ink-2);font-weight:600;font-size:12.5px;
  border-bottom:1px solid var(--line);z-index:1}
th[data-s]{cursor:pointer;user-select:none}
th[data-s]:hover{background:#EBF2F9;color:var(--b-blue)}
th[data-s]::after{content:"⇅";margin-left:5px;color:var(--ink-4);font-size:10px}
th[data-s].len::after{content:"▲";color:var(--b-blue)}
th[data-s].gim::after{content:"▼";color:var(--b-blue)}
th.l,td.l{text-align:left} th.c,td.c{text-align:center}
td{font-variant-numeric:tabular-nums}
tbody tr:hover{background:#F7FBFE}
tr.tot td{font-weight:700;background:var(--sf-2);border-top:1px solid #D5E1EC}
tr.tot2 td{font-weight:700;background:#FBF4F7;color:var(--b-magenta-d);border-top:1px solid #EBD3DC}
tr.nh td{background:#F0F6FB;font-weight:600}
tr.kt td{background:#F7FAFD;color:var(--ink-2);font-style:italic}
.xanh{color:var(--ok)} .do{color:var(--bad)} .xam{color:var(--ink-4)}

/* ---------- 7. NHÃN ---------- */
.tag{display:inline-block;padding:1px 8px;border-radius:4px;background:var(--line-2);
  color:var(--ink-2);font-size:12px;margin-right:3px}
.tag.x{background:var(--ok-bg);color:var(--ok)}
.tag.d{background:var(--bad-bg);color:var(--bad)}
.tag.w{background:var(--warn-bg);color:var(--warn)}
.ch{color:var(--ink-3);font-size:12.5px;padding:8px 14px}

/* ---------- 8. BIỂU ĐỒ ---------- */
svg.bd{display:block;width:100%;height:auto;overflow:visible}
svg.bd.vanh{max-width:248px;margin:0 auto}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink-2);padding:9px 0 0}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:0 0 auto}
.leg b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
#tt{position:fixed;z-index:60;pointer-events:none;display:none;background:#fff;
  border:1px solid var(--line);border-radius:7px;box-shadow:0 6px 18px rgba(15,32,58,.14);
  padding:8px 10px;font-size:12.5px;min-width:150px;max-width:86vw}
#tt .tn{font-weight:700;margin-bottom:5px;color:var(--ink)}
#tt table{font-size:12.5px;width:100%}
#tt td{border:0;padding:1px 0 1px 10px;white-space:nowrap}
#tt td.l{padding:1px 0;color:var(--ink-2)}
#tt i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
.ngang{display:grid;grid-template-columns:minmax(120px,228px) minmax(0,1fr) 84px;
  gap:5px 10px;align-items:center;font-size:12.5px}
.ngang .tn{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ngang .th{position:relative;height:13px;background:var(--line-2);border-radius:3px;overflow:hidden}
.ngang .th i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--c1)}
.ngang .th u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-3)}
.ngang .gt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- 9. HÀNG LỌC ---------- */
.loc{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--sf);
  border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:0 0 14px}
.loc input[type=text]{min-width:min(300px,70vw);flex:1 1 220px}
.loc .kq{margin-left:auto;color:var(--ink-3);font-size:12.5px;font-variant-numeric:tabular-nums}

/* ---------- 10. NGĂN KÉO ---------- */
#nen{position:fixed;inset:0;background:rgba(15,32,58,.3);z-index:50;display:none}
#nk{position:fixed;top:0;right:0;bottom:0;width:min(980px,100vw);background:var(--bg);z-index:51;
  transform:translateX(102%);transition:transform .18s ease-out;overflow:auto;
  box-shadow:-8px 0 24px rgba(15,32,58,.14);-webkit-overflow-scrolling:touch}
#nk.on{transform:none}
#nk .hd{position:sticky;top:0;z-index:2;background:var(--sf);border-bottom:1px solid var(--line);
  padding:13px 16px;display:flex;align-items:center}
#nk .hd h3{margin:0;font-size:14px;color:var(--ink)}
#nk .hd button.x{margin-left:auto;background:none;border:0;font-size:20px;color:var(--ink-3);cursor:pointer}
#nk .nd{padding:14px 16px 40px}
input[type=number],input[type=text],select{font:inherit;border:1px solid #D2DEEA;border-radius:5px;
  padding:6px 9px;color:var(--ink);background:var(--sf);max-width:100%}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums;width:100%}
.hang{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.hang .f{display:flex;flex-direction:column;gap:4px}
.hang .f span{font-size:11.5px;color:var(--ink-3)}
table.nhap td{padding:4px 6px}
table.nhap input{min-width:102px}

/* ---------- 11. THIẾT BỊ NHỎ ---------- */
@media (max-width:1180px){
  .hai,.haiV,.haiV.phai{grid-template-columns:minmax(0,1fr)}
  .oct.s6,.oct.s5{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:900px){
  #wrap{display:block}
  #sb{width:auto;flex:none;display:flex;overflow-x:auto;border-right:0;
    border-bottom:1px solid var(--line);padding:0;scrollbar-width:none;
    position:sticky;top:52px;z-index:30}
  #sb::-webkit-scrollbar{display:none}
  #sb .nh{display:none}
  #sb .m{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:11px 14px}
  #sb .m.on{border-left:0;border-bottom-color:var(--b-blue);background:#EFF6FC}
  #hd{padding:12px 14px}
  #hd h1{font-size:16px}
  #hd .nut{margin-left:0;width:100%;justify-content:flex-start}
  #kq{padding:12px 14px 40px}
  .oct,.oct.s6,.oct.s5,.oct.s3{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .o .v{font-size:19px}
  .bgw{max-height:none}
  #cnbar .pbn{display:none}
  #cnbar .logo{padding:0 12px}
}
@media (max-width:560px){
  .oct,.oct.s6,.oct.s5,.oct.s3{grid-template-columns:minmax(0,1fr)}
  .ngang{grid-template-columns:minmax(0,1fr) 78px;gap:3px 8px}
  .ngang .tn{grid-column:1/-1;font-size:12px}
  .kh>h2{font-size:13px;padding:11px 12px 11px 18px}
  .kh .nd{padding:11px 10px}
  th,td{padding:6px 8px;font-size:12.5px}
  .loc{padding:9px 10px}
}
@media print{
  #sb,#cnbar .ct,#cnbar .pbn,#hd .nut,#nen,#nk,.kh>h2 .pm,.loc{display:none}
  body{background:#fff}
  #cnbar{background:#fff;box-shadow:none;border-bottom:2px solid var(--b-magenta)}
  #cnbar::before{display:none}
  #cnbar .logo img{display:none}
  #cnbar .logo .lc{display:block}
  .kh{break-inside:avoid}
  .bgw{max-height:none;overflow:visible}
}

function pc(v, d) {
  if (v == null || isNaN(v)) return "—";
  d = d == null ? 2 : d;
  return (v * 100).toLocaleString("vi-VN", {minimumFractionDigits: d, maximumFractionDigits: d}) + "%";
}
function dpc(v, d) {
  if (v == null || isNaN(v) || !isFinite(v)) return "—";
  d = d == null ? 2 : d;
  return (v > 0 ? "+" : "") + (v * 100).toLocaleString("vi-VN", {minimumFractionDigits: d, maximumFractionDigits: d}) + "%";
}
function cls(v) { return v > 0 ? "xanh" : (v < 0 ? "do" : "xam"); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c];
  });
}
function tenThang(t) { return "T" + t + (laNhap(t) ? "*" : ""); }

/* ---------------- tooltip */
var TT = document.getElementById("tt");
function ttHien(x, y, html) {
  TT.innerHTML = html; TT.style.display = "block";
  var r = TT.getBoundingClientRect();
  var l = x + 14, tp = y - r.height / 2;
  if (l + r.width > innerWidth - 8) l = Math.max(8, x - r.width - 14);
  if (tp < 8) tp = 8;
  if (tp + r.height > innerHeight - 8) tp = Math.max(8, innerHeight - r.height - 8);
  TT.style.left = l + "px"; TT.style.top = tp + "px";
}
function ttAn() { TT.style.display = "none"; }
addEventListener("scroll", ttAn, true);

/* ---------------- vẽ hoãn, huỷ nếu đã đổi trang */
var GEN = 0;
function sau(f) {
  var g = GEN;
  setTimeout(function () {
    if (g !== GEN) return;
    try { f(); } catch (e) { if (window.console) console.error("vẽ:", e && e.message); }
  }, 0);
}

/* =====================================================================
   BIỂU ĐỒ — SVG tự vẽ, co theo bề ngang thiết bị
   ===================================================================== */
var NHO = false;
function doNho() { return innerWidth < 820; }
function K() {
  return NHO
    ? {W: 400, H: 250, PL: 44, PR: 10, PT: 12, PB: 30, fs: 11, fsn: 11.5, bw: 20}
    : {W: 760, H: 236, PL: 56, PR: 14, PT: 14, PB: 30, fs: 10.5, fsn: 10.5, bw: 34};
}
/* số lẻ của nhãn trục phải theo ĐỘ RỘNG của dải, không cố định:
   dải 0,137%–0,145% mà in 1 số lẻ thì bốn vạch đều ra "0,1%". */
function soLe(dai, dv) {
  if (dv === "%") return dai < 0.004 ? 3 : (dai < 0.03 ? 2 : 1);
  return dai < 2e9 ? 2 : (dai < 2e10 ? 1 : 0);
}
function nhanTruc(v, dv, d) { return dv === "%" ? pc(v, d) : ty(v, d); }
function moiNhan(ts, i) {   /* bớt nhãn trục ngang khi màn hình hẹp */
  if (!NHO) return true;
  return ts.length <= 7 || i % 2 === 0 || i === ts.length - 1;
}

function khung(ts, vmin, vmax, dv, band) {
  var g = K(), n = ts.length;
  var iw = g.W - g.PL - g.PR, ih = g.H - g.PT - g.PB;
  var sx = band ? function (i) { return g.PL + iw * (i + .5) / n; }
                : function (i) { return g.PL + (n === 1 ? iw / 2 : iw * i / (n - 1)); };
  var sy = function (v) { return g.PT + ih - (v - vmin) / ((vmax - vmin) || 1) * ih; };
  var luoi = "", nhan = "", sl = soLe(vmax - vmin, dv);
  for (var k = 0; k <= 4; k++) {
    var v = vmin + (vmax - vmin) * k / 4, y = sy(v);
    luoi += '<line x1="' + g.PL + '" y1="' + y.toFixed(1) + '" x2="' + (g.W - g.PR) + '" y2="' + y.toFixed(1) + '"/>';
    nhan += '<text x="' + (g.PL - 7) + '" y="' + (y + 3.4).toFixed(1) + '" font-size="' + g.fs
      + '" fill="var(--ink-4)" text-anchor="end">' + nhanTruc(v, dv, sl) + "</text>";
  }
  ts.forEach(function (t, i) {
    if (!moiNhan(ts, i)) return;
    nhan += '<text x="' + sx(i).toFixed(1) + '" y="' + (g.H - 9) + '" font-size="' + g.fsn
      + '" fill="var(--ink-3)" text-anchor="middle">' + esc(typeof t === "number" ? tenThang(t) : t) + "</text>";
  });
  return {g: g, sx: sx, sy: sy, sl: sl, mo: '<svg class="bd" viewBox="0 0 ' + g.W + " " + g.H + '" role="img">'
    + '<g stroke="var(--line-2)" stroke-width="1">' + luoi + "</g>" + nhan};
}

function legHTML(ser, f) {
  var h = '<div class="leg">';
  ser.forEach(function (se) {
    h += '<span><i style="background:' + se.hex + '"></i>' + esc(se.ten) + (f ? " <b>" + f(se) + "</b>" : "") + "</span>";
  });
  return h + "</div>";
}
function co(v) { return v != null && !isNaN(v); }

/* đường — bỏ qua điểm trống, không nối ngang qua chỗ thiếu số */
function veDuong(el, o) {
  var ts = o.thang, ser = o.series, dv = o.dv || "ty";
  var vmin = Infinity, vmax = -Infinity;
  ser.forEach(function (s) { s.gt.forEach(function (v) { if (co(v)) { if (v > vmax) vmax = v; if (v < vmin) vmin = v; } }); });
  if (vmax === -Infinity) { vmin = 0; vmax = 1; }
  if (o.tu0 === false) {
    var pad = (vmax - vmin) * .22 || Math.abs(vmax) * .12 || 1;
    vmin -= pad; vmax += pad;
  } else { vmin = Math.min(0, vmin); vmax = vmax * 1.12 || 1; }
  var Kx = khung(ts, vmin, vmax, dv), g = Kx.g, s = Kx.mo;
  ser.forEach(function (se, si) {
    var run = [];
    function xaRun() {
      if (run.length > 1) {
        s += '<polyline points="' + run.join(" ") + '" fill="none" stroke="' + se.hex
          + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"'
          + (se.nhat ? ' stroke-dasharray="5 4"' : "") + "/>";
      }
      run = [];
    }
    se.gt.forEach(function (v, i) {
      if (!co(v)) { xaRun(); return; }
      run.push(Kx.sx(i).toFixed(1) + "," + Kx.sy(v).toFixed(1));
    });
    xaRun();
    se.gt.forEach(function (v, i) {
      if (!co(v)) return;
      s += '<circle cx="' + Kx.sx(i).toFixed(1) + '" cy="' + Kx.sy(v).toFixed(1)
        + '" r="3.2" fill="#fff" stroke="' + se.hex + '" stroke-width="2"/>';
    });
    var li = -1;
    se.gt.forEach(function (v, i) { if (co(v)) li = i; });
    if (li >= 0) {
      s += '<text x="' + (Kx.sx(li) - 6).toFixed(1) + '" y="' + (Kx.sy(se.gt[li]) - 9).toFixed(1)
        + '" font-size="' + (g.fs + 0.5) + '" font-weight="700" fill="var(--ink)" text-anchor="end">'
        + (dv === "%" ? pc(se.gt[li], Math.max(2, Kx.sl)) : ty(se.gt[li], 1)) + "</text>";
    }
  });
  s += '<g class="cr" style="display:none"><line y1="' + g.PT + '" y2="' + (g.H - g.PB)
    + '" stroke="var(--ink-4)" stroke-width="1"/></g>';
  ts.forEach(function (t, i) {
    var x0 = i === 0 ? g.PL : (Kx.sx(i - 1) + Kx.sx(i)) / 2;
    var x1 = i === ts.length - 1 ? g.W - g.PR : (Kx.sx(i) + Kx.sx(i + 1)) / 2;
    s += '<rect class="hv" data-i="' + i + '" x="' + x0.toFixed(1) + '" y="' + g.PT + '" width="'
      + Math.max(1, x1 - x0).toFixed(1) + '" height="' + (g.H - g.PT - g.PB) + '" fill="transparent"/>';
  });
  el.innerHTML = s + "</svg>" + legHTML(ser, null);
  var svg = el.querySelector("svg"), cr = svg.querySelector("g.cr");
  function hien(ev, r) {
    var i = +r.dataset.i;
    cr.style.display = ""; cr.firstChild.setAttribute("x1", Kx.sx(i)); cr.firstChild.setAttribute("x2", Kx.sx(i));
    var h = '<div class="tn">' + (typeof ts[i] === "number" ? "Tháng " + ts[i] + (laNhap(ts[i]) ? " · nhập tay" : "") : esc(ts[i])) + "</div><table>";
    ser.forEach(function (se) {
      h += '<tr><td class="l"><i style="background:' + se.hex + '"></i>' + esc(se.ten) + "</td><td><b>"
        + (co(se.gt[i]) ? (dv === "%" ? pc(se.gt[i], 2) : ty(se.gt[i], 2) + " tỷ") : "—") + "</b></td></tr>";
    });
    ttHien(ev.clientX, ev.clientY, h + "</table>");
  }
  svg.querySelectorAll("rect.hv").forEach(function (r) {
    r.addEventListener("mousemove", function (ev) { hien(ev, r); });
    r.addEventListener("touchstart", function (ev) { hien(ev.touches[0], r); }, {passive: true});
  });
  svg.addEventListener("mouseleave", function () { ttAn(); cr.style.display = "none"; });
}

/* cột xếp tầng */
function veCot(el, o) {
  var ts = o.thang, ser = o.series;
  var tong = ts.map(function (t, i) { var s = 0; ser.forEach(function (se) { s += Math.max(0, se.gt[i] || 0); }); return s; });
  var vmax = Math.max.apply(null, tong) * 1.14 || 1;
  var Kx = khung(ts, 0, vmax, o.dv || "ty", true), g = Kx.g, s = Kx.mo;
  var bw = Math.min(g.bw, (g.W - g.PL - g.PR) / ts.length * .58);
  ts.forEach(function (t, i) {
    var acc = 0;
    ser.forEach(function (se, si) {
      var v = Math.max(0, se.gt[i] || 0); if (v <= 0) return;
      acc += v;
      var yt = Kx.sy(acc), yb = Kx.sy(acc - v) - (si > 0 ? 2 : 0);
      s += '<rect x="' + (Kx.sx(i) - bw / 2).toFixed(1) + '" y="' + yt.toFixed(1) + '" width="' + bw.toFixed(1)
        + '" height="' + Math.max(0.5, yb - yt).toFixed(1) + '" rx="' + (si === ser.length - 1 ? 3 : 0)
        + '" fill="' + se.hex + '"/>';
    });
    if (!NHO || moiNhan(ts, i)) {
      s += '<text x="' + Kx.sx(i).toFixed(1) + '" y="' + (Kx.sy(tong[i]) - 6).toFixed(1)
        + '" font-size="' + g.fs + '" fill="var(--ink-2)" text-anchor="middle">' + ty(tong[i], 0) + "</text>";
    }
    s += '<rect class="hv" data-i="' + i + '" x="' + (Kx.sx(i) - bw / 2 - 4).toFixed(1) + '" y="' + g.PT
      + '" width="' + (bw + 8).toFixed(1) + '" height="' + (g.H - g.PT - g.PB) + '" fill="transparent"/>';
  });
  el.innerHTML = s + "</svg>" + (ser.length > 1 ? legHTML(ser, null) : "");
  var svg = el.querySelector("svg");
  function hien(ev, r) {
    var i = +r.dataset.i;
    var h = '<div class="tn">' + (typeof ts[i] === "number" ? "Tháng " + ts[i] : esc(ts[i])) + "</div><table>";
    ser.slice().reverse().forEach(function (se) {
      h += '<tr><td class="l"><i style="background:' + se.hex + '"></i>' + esc(se.ten) + "</td><td><b>"
        + ty(se.gt[i], 2) + " tỷ</b></td></tr>";
    });
    if (ser.length > 1) h += '<tr><td class="l"><b>Cộng</b></td><td><b>' + ty(tong[i], 2) + " tỷ</b></td></tr>";
    ttHien(ev.clientX, ev.clientY, h + "</table>");
  }
  svg.querySelectorAll("rect.hv").forEach(function (r) {
    r.addEventListener("mousemove", function (ev) { hien(ev, r); });
    r.addEventListener("touchstart", function (ev) { hien(ev.touches[0], r); }, {passive: true});
  });
  svg.addEventListener("mouseleave", ttAn);
}

/* cột nhóm — nhiều chuỗi cạnh nhau (dùng cho so sánh 3 chi nhánh) */
function veCotNhom(el, o) {
  var nh = o.nhan, ser = o.series, dv = o.dv || "ty";
  var vmax = 0, vmin = 0;
  ser.forEach(function (s) { s.gt.forEach(function (v) { if (co(v)) { if (v > vmax) vmax = v; if (v < vmin) vmin = v; } }); });
  vmax = vmax * 1.14 || 1;
  var Kx = khung(nh, vmin, vmax, dv, true), g = Kx.g, s = Kx.mo;
  var n = nh.length, k = ser.length;
  var cum = Math.min(g.bw * 1.3, (g.W - g.PL - g.PR) / n * .72);
  var bw = Math.max(2, (cum - 2 * (k - 1)) / k);
  nh.forEach(function (t, i) {
    ser.forEach(function (se, j) {
      var v = se.gt[i]; if (!co(v)) return;
      var x = Kx.sx(i) - cum / 2 + j * (bw + 2);
      var y0 = Kx.sy(Math.max(0, vmin)), y = Kx.sy(v);
      s += '<rect x="' + x.toFixed(1) + '" y="' + Math.min(y, y0).toFixed(1) + '" width="' + bw.toFixed(1)
        + '" height="' + Math.max(0.5, Math.abs(y0 - y)).toFixed(1) + '" rx="2.5" fill="' + se.hex + '"/>';
    });
    s += '<rect class="hv" data-i="' + i + '" x="' + (Kx.sx(i) - cum / 2 - 3).toFixed(1) + '" y="' + g.PT
      + '" width="' + (cum + 6).toFixed(1) + '" height="' + (g.H - g.PT - g.PB) + '" fill="transparent"/>';
  });
  el.innerHTML = s + "</svg>" + legHTML(ser, null);
  var svg = el.querySelector("svg");
  function hien(ev, r) {
    var i = +r.dataset.i;
    var h = '<div class="tn">' + (typeof nh[i] === "number" ? "Tháng " + nh[i] : esc(nh[i])) + "</div><table>";
    ser.forEach(function (se) {
      h += '<tr><td class="l"><i style="background:' + se.hex + '"></i>' + esc(se.ten) + "</td><td><b>"
        + (co(se.gt[i]) ? (dv === "%" ? pc(se.gt[i], 2) : ty(se.gt[i], 2) + " tỷ") : "—") + "</b></td></tr>";
    });
    ttHien(ev.clientX, ev.clientY, h + "</table>");
  }
  svg.querySelectorAll("rect.hv").forEach(function (r) {
    r.addEventListener("mousemove", function (ev) { hien(ev, r); });
    r.addEventListener("touchstart", function (ev) { hien(ev.touches[0], r); }, {passive: true});
  });
  svg.addEventListener("mouseleave", ttAn);
}

/* vành khuyên */
function veVanh(el, o) {
  var it = o.items.filter(function (x) { return x.gt > 0; });
  var tot = it.reduce(function (s, x) { return s + x.gt; }, 0) || 1;
  var S = 232, R = 88, r0 = 52, cx = S / 2, cy = S / 2;
  var s = '<svg class="bd vanh" viewBox="0 0 ' + S + " " + S + '" role="img">';
  var a0 = -Math.PI / 2;
  it.forEach(function (x, i) {
    var sw = x.gt / tot * Math.PI * 2, gap = it.length > 1 ? 0.018 : 0;
    var a1 = a0 + sw - gap, big = (sw - gap) > Math.PI ? 1 : 0;
    var p = function (a, r) { return (cx + r * Math.cos(a)).toFixed(2) + " " + (cy + r * Math.sin(a)).toFixed(2); };
    s += '<path class="sl" data-i="' + i + '" d="M' + p(a0, R) + "A" + R + " " + R + " 0 " + big + " 1 " + p(a1, R)
      + "L" + p(a1, r0) + "A" + r0 + " " + r0 + " 0 " + big + " 0 " + p(a0, r0) + 'Z" fill="' + x.hex + '"/>';
    var am = a0 + (sw - gap) / 2;
    if (x.gt / tot > .085) {
      s += '<text x="' + (cx + (R + r0) / 2 * Math.cos(am)).toFixed(1) + '" y="'
        + (cy + (R + r0) / 2 * Math.sin(am) + 4).toFixed(1)
        + '" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">'
        + (x.gt / tot * 100).toFixed(0) + "%</text>";
    }
    a0 += sw;
  });
  s += '<text x="' + cx + '" y="' + (cy - 4) + '" font-size="18" font-weight="700" fill="var(--ink)" '
    + 'text-anchor="middle" font-family="var(--f-title)">' + ty(tot, 0) + "</text>"
    + '<text x="' + cx + '" y="' + (cy + 13) + '" font-size="11" fill="var(--ink-3)" text-anchor="middle">tỷ đồng</text></svg>';
  el.innerHTML = s + legHTML(it, function (x) { return ty(x.gt, 1) + " tỷ · " + (x.gt / tot * 100).toFixed(1) + "%"; });
  el.querySelectorAll("path.sl").forEach(function (pt) {
    function hien(ev) {
      var x = it[+pt.dataset.i];
      ttHien(ev.clientX, ev.clientY, '<div class="tn">' + esc(x.ten) + "</div><table>"
        + '<tr><td class="l">Giá trị</td><td><b>' + ty(x.gt, 2) + " tỷ</b></td></tr>"
        + '<tr><td class="l">Tỷ trọng</td><td><b>' + (x.gt / tot * 100).toFixed(1) + "%</b></td></tr>"
        + (x.gc ? '<tr><td class="l">' + esc(x.gc[0]) + "</td><td><b>" + esc(x.gc[1]) + "</b></td></tr>" : "")
        + "</table>");
    }
    pt.addEventListener("mousemove", hien);
    pt.addEventListener("touchstart", function (ev) { hien(ev.touches[0]); }, {passive: true});
    pt.addEventListener("mouseleave", ttAn);
  });
}

/* thanh ngang xếp hạng */
function veThanh(el, items) {

  vmax = vmax || 1;
  var h = '<div class="ngang">';

    h += '<div class="tn" title="' + esc(x.ten) + '">' + esc(x.ten) + "</div>"
      + '<div class="th"><i style="width:' + (Math.max(0, Math.min(1, x.gt / vmax)) * 100).toFixed(1)
      + "%;background:" + (x.hex || "var(--c1)") + '"></i>'

      + '</div><div class="gt ' + (x.cls || "") + '">' + (x.nhan != null ? x.nhan : ty(x.gt, 1)) + "</div>";
  });

}

/* bảng số kèm biểu đồ */
function bangSo(ts, ser, dv, nf) {
  nf = nf || tenThang;
  var h = '<div class="bgw"><table><thead><tr><th class="l">Chuỗi</th>';
  ts.forEach(function (t) { h += "<th>" + esc(nf(t)) + "</th>"; });

/* khối 2 chế độ xem */
var _kid = 0;
function khoi(tieu, dv, veFn, bangFn) {
  var id = "k" + (++_kid);
  var h = '<div class="kh" id="' + id + '"><h2>'
    + '<span class="pm"><button class="on" data-v="bd">Biểu đồ</button><button data-v="bg">Bảng số</button></span>'
    + esc(tieu) + (dv ? ' <span class="dv">· ' + esc(dv) + "</span>" : "") + "</h2>"
    + '<div class="nd" data-v="bd"></div><div class="nd k0" data-v="bg" style="display:none"></div></div>';

/* =====================================================================
   SẮP XẾP BẢNG — bấm tiêu đề cột: bé→lớn, bấm lại lớn→bé
   Dòng tổng / phân nhóm giữ nguyên vị trí.
   ===================================================================== */
function soTu(s) {
  s = String(s).replace(/[^0-9,\-−]/g, "").replace(/−/g, "-").replace(/,/g, ".");
  var v = parseFloat(s);
  return isNaN(v) ? null : v;
}
function batSap(root) {
  (root || document).querySelectorAll("table.sx").forEach(function (tb) {
    if (tb.dataset.sxOk) return;
    tb.dataset.sxOk = "1";
    var ths = tb.querySelectorAll("thead th");
    ths.forEach(function (th, j) {
      th.setAttribute("data-s", j);
      th.onclick = function () {
        var body = tb.tBodies[0];
        var all = Array.prototype.slice.call(body.rows);
        var dong = all.filter(function (r) { return !/tot|tot2|nh|kt/.test(r.className); });
        var khac = all.filter(function (r) { return /tot|tot2|nh|kt/.test(r.className); });
        var len = !th.classList.contains("len");
        ths.forEach(function (x) { x.classList.remove("len", "gim"); });
        th.classList.add(len ? "len" : "gim");
        dong.forEach(function (r, i) { if (r._i == null) r._i = i; });
        dong.sort(function (a, b) {
          var ta = a.cells[j] ? a.cells[j].textContent.trim() : "";
          var tbb = b.cells[j] ? b.cells[j].textContent.trim() : "";
          var na = soTu(ta), nb = soTu(tbb);
          var r;
          if (na != null && nb != null) r = na - nb;
          else r = ta.localeCompare(tbb, "vi");
          return len ? r : -r;
        });
        dong.forEach(function (r) { body.appendChild(r); });
        khac.forEach(function (r) { body.appendChild(r); });
      };
    });
  });
}

/* =====================================================================

/* ---------------- SAO LƯU & KHÔI PHỤC (toàn bộ các năm đã nhập) */
function saoLuu() {
  var d = new Date();
  function p2(x) { return ("0" + x).slice(-2); }
  var dau = d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + "-" + p2(d.getHours()) + p2(d.getMinutes());
  var goi = {
    loai: "sao-luu-dashboard-moi-gioi",
    ban: 1,
    luc: d.toISOString(),
    nam_goc: NAM_GOC,
    nam_co_so_lieu: dsNam(),
    du_lieu: NHAP
  };
  taiTep("sao-luu-dashboard-" + dau + ".json", JSON.stringify(goi, null, 1), "application/json");
}
function khoiPhuc(inp) {
  var f = inp.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    var j;
    try { j = JSON.parse(r.result); } catch (e) { alert("Tệp không đọc được: " + e.message); return; }
    var n = (j && j.du_lieu) ? j.du_lieu : j;
    if (!n || typeof n !== "object") { alert("Tệp không đúng khuôn sao lưu."); return; }
    if (n.HN || n.HCM || n.DN || n._cpv) { var c = {}; c[NAM_GOC] = n; n = c; }   /* bản cũ chưa tách năm */
    var ds = Object.keys(n).filter(function (k) { return /^\d{4}$/.test(k); });
    if (!ds.length) { alert("Tệp không có năm nào."); return; }
    if (!confirm("Khôi phục sẽ THAY TOÀN BỘ số đang nhập tay bằng tệp này.\nNăm trong tệp: "
      + ds.join(", ") + "\nTiếp tục?")) return;
    NHAP = n; luuNhap();
    if (ds.indexOf(String(NAM)) < 0) NAM = +ds[0];
    inp.value = "";
    veNut(); veNav(); ve();
    alert("Đã khôi phục. Năm có số: " + ds.join(", "));
  };
  r.readAsText(f);
}

function tyLeThoiGian() {

}
function oO(nh, vr, vf, u, kh, gc, hl) {

    + '<div class="v">' + vf + (u ? '<span class="u">' + u + "</span>" : "") + "</div>"
    + (p != null ? '<div class="bd ' + (p >= ttg ? "x" : "d") + '">' + (p * 100).toFixed(0) + "% KH</div>"
      + '<div class="tt"><i style="width:' + Math.max(0, Math.min(100, p * 100)).toFixed(1) + '%"></i></div>' : "")

  h += '<div class="oct s6">'
    + oO("Lợi nhuận môi giới", ln2, ty(ln2, 1), "tỷ", khDT - khCP, "", true)

  var sDT = {ten: "Doanh thu", hex: MAUHEX[0], gt: ts.map(function (t) { return tongDT(cn, t); })};
  var sL1 = {ten: "Lợi nhuận trước chi phí quản lý", hex: MAUHEX[2], gt: ts.map(function (t) { return lnTCPQL(cn, t); })};
  var sL2 = {ten: "Lợi nhuận môi giới", hex: MAUHEX[1], gt: ts.map(function (t) { return lnMG(cn, t); })};

    veThanh(e1, it);

        + cN(r.tra_so, "n0") + cN(r.hh_ctv, "n0") + cN(q.phi_rong, "n0") + cN(r.phi_ut, "n0")
        + cN(r.duno_bq, "n0") + cN(r.lai_ps, "n0") + cN(r.phi_gh, "n0") + cN(q.cp_von, "n0")
        + cN(q.ln, "n0") + cN(q.ls_thuc, "p"));
    });
    var q1 = _hq(T, cpvky);
    L.push(cS("") + cS("") + cS("Tổng cộng nhóm KH deal/mass", "b") + cN(T.n_tk, "b") + cN(T.gtgd, "n0b")
      + cN(T.phi, "n0b") + cN(T.tra_so, "n0b") + cN(T.hh_ctv, "n0b") + cN(q1.phi_rong, "n0b")
      + cN(T.phi_ut, "n0b") + cN(T.duno_bq, "n0b") + cN(T.lai_ps, "n0b") + cN(T.phi_gh, "n0b")
      + cN(q1.cp_von, "n0b") + cN(q1.ln, "n0b") + cN(q1.ls_thuc, "p"));
    var M = gomLoai(cn)["Mass thường"], q2 = _hq(M, cpvky);
    L.push(cS("") + cS("") + cS("KH mass thường (ngoài nhóm)", "b") + cN(M.n_tk, "b") + cN(M.gtgd, "n0b")
      + cN(M.phi, "n0b") + cN(M.tra_so, "n0b") + cN(M.hh_ctv, "n0b") + cN(q2.phi_rong, "n0b")
      + cN(M.phi_ut, "n0b") + cN(M.duno_bq, "n0b") + cN(M.lai_ps, "n0b") + cN(M.phi_gh, "n0b")
      + cN(q2.cp_von, "n0b") + cN(q2.ln, "n0b") + cN(q2.ls_thuc, "p"));
    var G = gomLoai(cn), A = {n_tk: 0, gtgd: 0, phi: 0, tra_so: 0, hh_ctv: 0, phi_ut: 0, duno_bq: 0, lai_ps: 0, phi_gh: 0};
    LOAI3.forEach(function (l) { Object.keys(A).forEach(function (f) { A[f] += G[l][f]; }); });
    var q3 = _hq(A, cpvky);
    L.push(cS("") + cS("") + cS("Tổng chi nhánh", "b") + cN(A.n_tk, "b") + cN(A.gtgd, "n0b")
      + cN(A.phi, "n0b") + cN(A.tra_so, "n0b") + cN(A.hh_ctv, "n0b") + cN(q3.phi_rong, "n0b")
      + cN(A.phi_ut, "n0b") + cN(A.duno_bq, "n0b") + cN(A.lai_ps, "n0b") + cN(A.phi_gh, "n0b")
      + cN(q3.cp_von, "n0b") + cN(q3.ln, "n0b") + cN(q3.ls_thuc, "p"));
    return L;
  }

  /* ---- sheet 5: chi tiết KH deal */
  var C = [];
  if (D.ct) {
    C.push(["STT", "Chi nhánh", "Nhóm", "Họ và tên", "STK", "NVCS", "GTGD", "Phí GD", "Phí trả sở",
      "Phí đã chi CTV", "Phí ròng", "Phí Ứng", "Dư nợ bình quân", "Lãi margin", "Phí gia hạn",
      "Chi phí vốn", "Lợi nhuận ròng"].map(function (x) { return cS(x, "h"); }).join(""));
    D.ct.slice().sort(function (a, b) { return b.duno_bq - a.duno_bq; }).forEach(function (r, i) {
      var q = _hq(r, cpvky);
      C.push(cN(i + 1) + cS(TEN_CN[r.cn]) + cS(r.ten_nhom) + cS(r.ten_kh) + cS(r.tk) + cS(r.nvcs)
        + cN(r.gtgd, "n0") + cN(r.phi, "n0") + cN(r.tra_so, "n0") + cN(r.hh_ctv, "n0")
        + cN(q.phi_rong, "n0") + cN(r.phi_ut, "n0") + cN(r.duno_bq, "n0") + cN(r.lai_ps, "n0")
        + cN(r.phi_gh, "n0") + cN(q.cp_von, "n0") + cN(q.ln, "n0"));
    });
  }

  var xml = '<?xml version="1.0" encoding="UTF-8"?>\n<?mso-application progid="Excel.Sheet"?>\n'
    + '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'
    + "<Styles>"
    + '<Style ss:ID="t"><Font ss:Bold="1" ss:Size="13"/></Style>'
    + '<Style ss:ID="h"><Font ss:Bold="1"/><Interior ss:Color="#F0F6FB" ss:Pattern="Solid"/>'
    + '<Alignment ss:Vertical="Center" ss:WrapText="1"/></Style>'
    + '<Style ss:ID="b"><Font ss:Bold="1"/></Style>'
    + '<Style ss:ID="n0"><NumberFormat ss:Format="#,##0"/></Style>'
    + '<Style ss:ID="n0b"><Font ss:Bold="1"/><NumberFormat ss:Format="#,##0"/></Style>'
    + '<Style ss:ID="n2"><NumberFormat ss:Format="#,##0.00"/></Style>'
    + '<Style ss:ID="p"><NumberFormat ss:Format="0.00%"/></Style>'
    + "</Styles>"
    + sheetXML("Tổng hợp KPI", R, [40, 230, 60, 90, 90, 60, 90, 90, 60, 90, 90, 60, 90, 90, 60])
    + sheetXML("Deal CN HN", sheetDeal("HN"), [40, 90, 220, 55, 120, 110, 110, 110, 110, 100, 130, 120, 110, 120, 130, 80])
    + sheetXML("Deal CN HCM", sheetDeal("HCM"), [40, 90, 220, 55, 120, 110, 110, 110, 110, 100, 130, 120, 110, 120, 130, 80])
    + sheetXML("Deal CN ĐN", sheetDeal("DN"), [40, 90, 220, 55, 120, 110, 110, 110, 110, 100, 130, 120, 110, 120, 130, 80])
    + (C.length ? sheetXML("Chi tiết KH deal", C, [40, 110, 200, 200, 100, 70, 120, 110, 110, 110, 110, 100, 130, 120, 110, 120, 130]) : "")
    + "</Workbook>";
  taiTep("Bao_cao_3_chi_nhanh_" + META.so_hieu + ".xls", xml, "application/vnd.ms-excel");
}

/* =====================================================================
   XUẤT BẢN XEM (WEB)  — chỉ có ở bản nội bộ
   Nhập số ở bản nội bộ xong bấm nút này: số nhập tay được nướng thẳng vào
   một file HTML công bố mới, đã bỏ tên khách hàng, bỏ số tài khoản, bỏ trang
   đối chiếu/nguồn và ẩn mã nhóm. Tải lên web là xong.
   Cách 2 (nhẹ hơn): chỉ tải "du-lieu-thang.json" đặt cạnh trang công bố —
   trang đó tự nạp tệp này mỗi lần mở, không cần thay file HTML.
   ===================================================================== */
function anNhom(nhom) {
  var tong = {};
  nhom.nhom.forEach(function (r) { tong[r.ma] = (tong[r.ma] || 0) + (r.duno_cuoi || 0); });
  var thutu = Object.keys(tong).sort(function (a, b) { return tong[b] - tong[a]; });
  var an = {}, i = 0;
  thutu.forEach(function (ma) { if (ma !== "MASS") an[ma] = "N" + ("0" + (++i)).slice(-2); });
  var ra = {nhom: [], loai: JSON.parse(JSON.stringify(nhom.loai)), ls_nhom: {}};
  nhom.nhom.forEach(function (r) {
    var d = JSON.parse(JSON.stringify(r));
    if (r.ma === "MASS") { d.ma = "MASS"; d.ten_nhom = "Mass thường"; }
    else { d.ma = an[r.ma] || "N??"; d.ten_nhom = ""; }
    ra.nhom.push(d);
  });
  Object.keys(nhom.ls_nhom || {}).forEach(function (ma) {
    if (an[ma]) ra.ls_nhom[an[ma]] = nhom.ls_nhom[ma];
  });
  return ra;
}
function payloadCongBo() {
  var P = JSON.parse(JSON.stringify({kt: D.kt, nhom: D.nhom, meta: D.meta}));
  /* tháng nhập tay của NĂM GỐC thì nướng thẳng vào kt; các năm khác đi theo P.nhap */
  var g = META.thang.slice(), tn = [];
  CN3.forEach(function (cn) {
    Object.keys((NHAP[NAM_GOC] || {})[cn] || {}).forEach(function (t) {
      if (g.indexOf(+t) < 0 && tn.indexOf(+t) < 0) tn.push(+t);
    });
  });
  tn.sort(function (a, b) { return a - b; });
  /* nướng tháng nhập tay vào dữ liệu gốc */
  var KG = NHAP[NAM_GOC] || {};
  tn.forEach(function (t) {
    CN3.forEach(function (cn) {
      var o = (KG[cn] || {})[t] || {};
      Object.keys(o).forEach(function (ma) {
        var v = +o[ma];
        if (ma === "duno_bq") P.kt[cn].duno_bq[t] = v;
        else if (ma === "ls_margin") P.kt[cn].ls_margin[t] = v;
        else if (ma === "gtgd") P.kt[cn].gtgd_cs_thang[t] = v;
        else if (ma === "gtgd_tp") P.kt[cn].gtgd_thang[t] = v;
        else if (ma === "thi_phan") P.kt[cn].tp_thang[t] = v;
        else {
          var box = ma.indexOf("2_1_") === 0 ? "cpnv" : (ma.indexOf("1_") === 0 ? "dt" : "cpql");
          P.kt[cn][box] = P.kt[cn][box] || {};
          P.kt[cn][box][ma] = P.kt[cn][box][ma] || {};
          P.kt[cn][box][ma][t] = v;
        }
      });
    });
    if (P.meta.thang.indexOf(t) < 0) P.meta.thang.push(t);
  });
  P.meta.thang.sort(function (a, b) { return a - b; });
  /* chi phí vốn và kế hoạch được giao nhập tay của NĂM GỐC */
  Object.keys(KG._cpv || {}).forEach(function (t) { P.meta.cpv[t] = +KG._cpv[t]; });
  Object.keys(KG._pdca || {}).forEach(function (cn) {
    Object.keys(KG._pdca[cn]).forEach(function (ma) {
      if (cn === "ALL") {
        P.meta.pdca_ct[ma] = P.meta.pdca_ct[ma] || {};
        P.meta.pdca_ct[ma].nam = +KG._pdca[cn][ma];
      } else if (P.kt[cn]) {
        P.kt[cn].pdca = P.kt[cn].pdca || {};
        P.kt[cn].pdca[ma] = P.kt[cn].pdca[ma] || {};
        P.kt[cn].pdca[ma].nam = +KG._pdca[cn][ma];
      }
    });
  });
  P.nhom = anNhom(P.nhom);
  P.dc = {thang: [], khong_map: 0};
  P.nhap = JSON.parse(JSON.stringify(NHAP));   /* mang theo các NĂM nhập tay */
  return P;                      /* KHÔNG có P.ct -> không có tên khách hàng */
}
function xuatCongBo() {
  var s = document.getElementById("du-lieu");
  if (!s) { alert("Không thấy khối dữ liệu."); return; }
  var cu = s.textContent;
  var js = JSON.stringify(payloadCongBo()).replace(/<\//g, "<\\/");
  var luu = {};
  ["kq", "sb", "ctbar", "nutbar", "nknd", "tt"].forEach(function (id) {
    var e = document.getElementById(id);
    if (e) { luu[id] = e.innerHTML; e.innerHTML = ""; }
  });
  var nk = document.getElementById("nk"), nen = document.getElementById("nen");
  var nkc = nk.className, nens = nen.style.display;
  nk.className = ""; nen.style.display = "none";
  var hash = location.hash;
  s.textContent = "window.__DATA=" + js + ';window.__BAN="cong_bo";';
  var html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  s.textContent = cu;
  Object.keys(luu).forEach(function (id) { document.getElementById(id).innerHTML = luu[id]; });
  nk.className = nkc; nen.style.display = nens;
  if (hash) { try { history.replaceState(null, "", hash); } catch (e) {} }
  veCNBar(); veNav(); veNut(); ve();
  taiTep("Dashboard-TSC-cong-bo.html", html, "text/html");
}

  var f = {tq: trangTQ, dt: trangDT, gd: trangGD, dn: trangDN, tp: trangTP, ln: trangLN,
    hq: trangHQ, ss: trangSS, kh: trangKH, dc: trangDC, ng: trangNG}[TAB];

  el.innerHTML = f ? f() : "";
  batSap(el);
}
var _rz = null;
addEventListener("resize", function () {

veCNBar(); veNav(); veNut(); ve();

/* Bản công bố: nếu trên web có đặt "du-lieu-thang.json" cạnh trang thì tự nạp
   đè — cập nhật tháng mới chỉ cần thay tệp JSON vài KB, không phải thay HTML.
   Mở bằng file:// thì fetch hỏng, bỏ qua, trang vẫn chạy bằng số đã nướng sẵn. */
if (!NOIBO && location.protocol !== "file:") {
  try {
    fetch("du-lieu-thang.json", {cache: "no-store"})
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (j && typeof j === "object" && Object.keys(j).length) { NHAP = j; ve(); }
      })
      .catch(function () {});
  } catch (e) {}
}
